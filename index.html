<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Angga</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff69b4, #ff1493, #000000);
      color: white;
    }

    .container {
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #f5f5f5;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      padding: 16px 25px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 8px 25px rgba(255, 20, 147, 0.45);
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(255, 20, 147, 0.7);
    }

    .button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Halo 👋</h1>
    <p>Silakan klik tombol di bawah untuk mulai mengobrol dengan Angga.</p>

    <a
      class="button"
      href="https://wa.me/6285199389297"
      target="_blank"
      rel="noopener noreferrer">
      MULAI MENGOBROL DENGAN ANGGA
    </a>
  </div>

</body>
</html>
